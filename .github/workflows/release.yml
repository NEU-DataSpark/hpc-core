name: Release

on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: The tag must equal the pyproject version
        if: github.event_name == 'push'
        run: python tools/check_release_tag.py "$GITHUB_REF_NAME"
      - name: Set the development version
        if: github.event_name == 'workflow_run'
        env:
          CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: python tools/prepare_dev_version.py "$CI_RUN_NUMBER" "$CI_RUN_ATTEMPT"
      - name: Build the sdist and the wheel
        run: |
          python -m pip install build twine
          python -m build
      - name: Check the distributions
        run: |
          python -m twine check --strict dist/*
          python tools/check_wheel.py dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hpc-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: ${{ github.event_name == 'workflow_run' }}
