name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6"
          python-version: "3.14"
      - name: Lock check
        run: uv lock --check
      - run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Strict type check
        run: uv run mypy
      - name: Hygiene scan
        run: uv run python tools/hygiene_scan.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python-version }}
      - name: Install from the lock
        run: uv sync --locked --extra dev
      - name: Test suite
        run: uv run pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Build the wheel
        run: python -m pip wheel --no-deps -w dist .
      - name: Check the fixtures, skills and license files are packaged
        run: python tools/check_wheel.py dist/hpc_core-*.whl
      - name: Install the wheel in a clean environment and run the command line
        run: |
          python -m venv "$RUNNER_TEMP/hpc-core-cli"
          "$RUNNER_TEMP/hpc-core-cli/bin/python" -m pip install --no-deps dist/hpc_core-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/hpc-core-cli/bin/hpc-core" --version
          "$RUNNER_TEMP/hpc-core-cli/bin/hpc-core" skills list
