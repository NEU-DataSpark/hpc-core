[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hpc-core"
version = "0.2.0"
description = "Dependency-free contract, transport interface and Slurm adapter for DataSpark HPC tools."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pip>=24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hpc_core = ["py.typed"]
"hpc_core.testing" = ["fixtures/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/hpc_core", "tests", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
